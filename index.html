function loadState(){const saved=localStorage.getItem(STORE_KEY);if(saved)return JSON.parse(saved);const seed={menu:initialMenu,cart:{},orders:[{id:'FY-1001',createdAt:new Date(Date.now()-1000*60*42).toISOString(),status:'Accepted',customer:{name:'Sample Customer',phone:'0612-000-111',address:'AUI Campus, Ifrane',instructions:'Call when outside'},payment:'Cash',deliveryId:'d1',items:[{id:'korean-burger',name:'Korean Burger',price:45,qty:1},{id:'mojito',name:'Mojito',price:25,qty:1}],total:70},{id:'FY-1002',createdAt:new Date(Date.now()-1000*60*18).toISOString(),status:'Order received',customer:{name:'Test Order',phone:'0600-222-333',address:'Downtown Ifrane',instructions:''},payment:'Card at delivery',deliveryId:'',items:[{id:'frosty-fries',name:'Frosty Fries',price:35,qty:1},{id:'soda',name:'Soda',price:10,qty:1}],total:45}],deliveryPeople,lastOrderId:'FY-1002',chat:[{from:'bot',text:'Hi. Tell me what you feel like eating: sushi, loaded fries, very hungry, drink, dessert, or no cheese.'}]};localStorage.setItem(STORE_KEY,JSON.stringify(seed));return seed}
function saveState(){localStorage.setItem(STORE_KEY,JSON.stringify(state))}function money(n){return `${n} MAD`}function byId(id){return document.getElementById(id)}function getMenuItem(id){return state.menu.find(x=>x.id===id)}function getDeliveryName(id){const d=state.deliveryPeople.find(x=>x.id===id);return d?d.name:'Not assigned'}function navItems(){return[['home','Home'],['menu','Menu'],['cart',`Cart (${cartCount()})`],['track','Track Order'],['assistant','AI Assistant'],['manager','Manager'],['delivery','Delivery']]}function renderNav(){byId('nav').innerHTML=navItems().map(([id,label])=>`<button class="${currentPage===id?'active':''}" onclick="go('${id}')">${label}</button>`).join('')}function go(page){currentPage=page;document.querySelectorAll('.section').forEach(s=>s.classList.remove('active'));byId(page).classList.add('active');renderAll();scrollTo({top:0,behavior:'smooth'})}function renderAll(){renderNav();renderHome();renderMenu();renderCart();renderTrack();renderAssistant();renderManager();renderDelivery()}
function cartCount(){return Object.values(state.cart).reduce((s,q)=>s+q,0)}function cartItems(){return Object.entries(state.cart).map(([id,qty])=>({...getMenuItem(id),qty})).filter(x=>x.id)}function cartTotal(){return cartItems().reduce((s,x)=>s+x.price*x.qty,0)}
function renderHome(){const delivered=state.orders.filter(o=>o.status==='Delivered').length;byId('home').innerHTML=`<div class="hero"><div class="hero-card"><span class="tag dark">Mobile-friendly ordering system</span><h1>Order from For You without waiting on the phone.</h1><p>This academic prototype digitizes menu browsing, checkout, order tracking, manager order control, delivery assignment, and basic analytics.</p><div class="hero-actions"><button class="primary" onclick="go('menu')">Order Now</button><button class="secondary" onclick="go('assistant')">Ask the Assistant</button><button class="ghost" onclick="go('manager')">Manager Dashboard</button></div></div><div class="hero-side card"><div class="stat-box"><div class="stat-value">${state.menu.length}</div><div class="stat-label">Menu items</div></div><div class="stat-box"><div class="stat-value">${state.orders.length}</div><div class="stat-label">Orders in demo system</div></div><div class="stat-box"><div class="stat-value">${delivered}</div><div class="stat-label">Delivered orders</div></div></div></div><h2 style="margin-top:28px">Featured dishes</h2><div class="grid">${state.menu.slice(0,6).map(dishCard).join('')}</div>`}
function renderMenu(){const categories=['All',...new Set(state.menu.map(x=>x.category))];const filtered=state.menu.filter(item=>(menuFilter==='All'||item.category===menuFilter)&&(item.name.toLowerCase().includes(searchText.toLowerCase())||item.desc.toLowerCase().includes(searchText.toLowerCase())||item.ingredients.join(' ').toLowerCase().includes(searchText.toLowerCase())));const totalPages=Math.max(1,Math.ceil(filtered.length/MENU_ITEMS_PER_PAGE));if(menuPage>totalPages)menuPage=totalPages;if(menuPage<1)menuPage=1;const start=(menuPage-1)*MENU_ITEMS_PER_PAGE;const pageItems=filtered.slice(start,start+MENU_ITEMS_PER_PAGE);const from=filtered.length?start+1:0,to=Math.min(start+MENU_ITEMS_PER_PAGE,filtered.length);const pageButtons=Array.from({length:totalPages},(_,i)=>i+1).map(p=>`<button class="secondary ${menuPage===p?'active':''}" onclick="menuPage=${p};renderMenu()" style="min-width:44px;${menuPage===p?'background:var(--dark);color:white;border-color:var(--dark);':''}">${p}</button>`).join('');byId('menu').innerHTML=`<h2>Our Menu</h2><p>The menu is now split into pages. You only see 12 items at a time, then move to the next page.</p><div class="toolbar"><input class="input" placeholder="Search for burgers, sushi, drinks..." value="${escapeHtml(searchText)}" oninput="searchText=this.value;menuPage=1;renderMenu()"/>${categories.map(c=>`<button class="category-btn secondary ${menuFilter===c?'active':''}" onclick="menuFilter='${escapeJs(c)}';menuPage=1;renderMenu()">${c}</button>`).join('')}</div><div class="notice">Showing ${from}-${to} of ${filtered.length} item(s) ${menuFilter==='All'?'in all categories':'in '+menuFilter}. Use the page buttons below instead of scrolling through the whole menu.</div><div class="grid">${pageItems.map(dishCard).join('')||'<div class="card"><p>No items found.</p></div>'}</div><div class="card" style="margin-top:18px;padding:16px"><div class="row" style="justify-content:center;margin-bottom:10px"><button class="secondary ${menuPage<=1?'disabled':''}" onclick="menuPage--;renderMenu()">Previous</button><span class="tag dark">Page ${menuPage} / ${totalPages}</span><button class="secondary ${menuPage>=totalPages?'disabled':''}" onclick="menuPage++;renderMenu()">Next</button></div><div class="row" style="justify-content:center">${pageButtons}</div></div>`}

};
function hashText(text){let h=0;for(let i=0;i<text.length;i++)h=Math.imul(31,h)+text.charCodeAt(i)|0;return Math.abs(h%100000)}function imagePrompt(item){return `professional realistic restaurant food photography of ${item.name}, ${item.category}, ${item.ingredients.slice(0,4).join(', ')}, served on a plate, warm lighting, appetizing, high quality, no text, no watermark`}function imageUrl(item){if(uploadedImageMap[item.id])return uploadedImageMap[item.id];return `https://image.pollinations.ai/prompt/${encodeURIComponent(imagePrompt(item))}?width=600&height=380&seed=${hashText(item.id)}&nologo=true`}?width=600&height=380&seed=${hashText(item.id)}&nologo=true`}
function dishCard(item){const unavailable=!item.available;return `<div class="card dish-card"><div class="dish-img" style="background-image:url('${imageUrl(item)}')"></div><div class="dish-meta"><h3>${item.name}</h3><span class="price">${money(item.price)}</span></div><div class="row"><span class="tag">${item.prep}</span><span class="tag ${item.available?'green':'red'}">${item.available?'Available':'Unavailable'}</span></div><p>${item.desc}</p><div class="row"><button class="secondary" onclick="openItem('${item.id}')">View Details</button><button class="primary ${unavailable?'disabled':''}" onclick="addToCart('${item.id}')">Add to Cart</button></div></div>`}
function openItem(id){const item=getMenuItem(id);showModal(`<h2>${item.name}</h2><div class="dish-img" style="height:240px;margin-bottom:12px;background-image:url('${imageUrl(item)}')"></div><p>${item.desc}</p><div class="mini-line"><strong>Price</strong><span>${money(item.price)}</span></div><div class="mini-line"><strong>Preparation time</strong><span>${item.prep}</span></div><div class="mini-line"><strong>Ingredients</strong><span>${item.ingredients.join(', ')}</span></div><div class="mini-line"><strong>Availability</strong><span>${item.available?'Available':'Unavailable'}</span></div><div class="row" style="margin-top:16px"><button class="primary ${item.available?'':'disabled'}" onclick="addToCart('${item.id}');closeModal()">Add to Cart</button><button class="secondary" onclick="closeModal()">Close</button></div>`)}
function addToCart(id){const item=getMenuItem(id);if(!item||!item.available)return alert('This item is currently unavailable.');state.cart[id]=(state.cart[id]||0)+1;saveState();renderAll()}function changeQty(id,delta){state.cart[id]=(state.cart[id]||0)+delta;if(state.cart[id]<=0)delete state.cart[id];saveState();renderAll()}function removeFromCart(id){delete state.cart[id];saveState();renderAll()}
function renderCart(){const items=cartItems(),suggestions=getUpsellSuggestions();byId('cart').innerHTML=`<h2>Cart & Checkout</h2>${items.length===0?`<div class="card"><p>Your cart is empty.</p><button class="primary" onclick="go('menu')">Browse Menu</button></div>`:`<div class="grid-2"><div class="card"><h3>Order Summary</h3>${items.map(x=>`<div class="cart-line"><div><strong>${x.name}</strong><br><span class="tag">${money(x.price)} each</span></div><div class="qty"><button class="secondary" onclick="changeQty('${x.id}',-1)">-</button><strong>${x.qty}</strong><button class="secondary" onclick="changeQty('${x.id}',1)">+</button></div><strong>${money(x.price*x.qty)}</strong><button class="danger" onclick="removeFromCart('${x.id}')">Remove</button></div>`).join('')}<div class="cart-line"><strong>Total</strong><strong>${money(cartTotal())}</strong></div><h3 style="margin-top:18px">Frequently ordered with</h3>${suggestions.length?suggestions.map(s=>`<div class="mini-line"><span>${s.name} - ${money(s.price)}</span><button class="secondary" onclick="addToCart('${s.id}')">Add</button></div>`).join(''):'<p>No suggestion yet.</p>'}</div><div class="card"><h3>Customer Information</h3><div class="form-grid"><input id="custName" class="input" placeholder="Name"/><input id="custPhone" class="input" placeholder="Phone number"/><input id="custAddress" class="input full" placeholder="Delivery address"/><textarea id="custInstructions" class="full" placeholder="Delivery instructions or food preferences"></textarea><select id="paymentMethod" class="input full"><option>Cash</option><option>Card at delivery</option></select></div><button class="primary" style="margin-top:14px;width:100%" onclick="placeOrder()">Confirm Order</button></div></div>`}`}
function getUpsellSuggestions(){const inCart=new Set(Object.keys(state.cart));const base=cartItems();let preferred=[];if(base.some(x=>['Premium Sandwiches','Sandwiches','Loaded Fries','Loaded Mac','Combos'].includes(x.category)))preferred=['fries','mojito','sundae-classic'];else if(base.some(x=>['For You Rolls','Boxes','Spring Rolls','Californias','Maxis','Futomakis','Sushi Burrito','Bowls'].includes(x.category)))preferred=['mojito','sweet-fusion-smoothie','cheesecup'];else if(base.some(x=>x.category==='Drinks + Coffee'))preferred=['banoffee-pie','oreo-parfait'];else preferred=['fries','soda','sundae-classic'];return preferred.map(getMenuItem).filter(x=>x&&x.available&&!inCart.has(x.id)).slice(0,3)}
function placeOrder(){const items=cartItems();if(!items.length)return alert('Your cart is empty.');const unavailable=items.find(x=>!x.available);if(unavailable)return alert(`${unavailable.name} is no longer available. Remove it before checkout.`);const name=byId('custName').value.trim(),phone=byId('custPhone').value.trim(),address=byId('custAddress').value.trim(),instructions=byId('custInstructions').value.trim(),payment=byId('paymentMethod').value;if(!name||!phone||!address)return alert('Please fill in name, phone number, and address.');const id=`FY-${Math.floor(1000+Math.random()*9000)}`;const order={id,createdAt:new Date().toISOString(),status:'Order received',customer:{name,phone,address,instructions},payment,deliveryId:'',items:items.map(x=>({id:x.id,name:x.name,price:x.price,qty:x.qty})),total:cartTotal()};state.orders.unshift(order);state.cart={};state.lastOrderId=id;saveState();alert(`Order confirmed. Your order ID is ${id}`);go('track')}
function renderTrack(){const id=state.lastOrderId||'',order=id?state.orders.find(o=>o.id===id):null;byId('track').innerHTML=`<h2>Track Order</h2><div class="card"><p>Enter an order ID or use the latest order created in this browser.</p><div class="row"><input id="trackId" class="input" value="${id}" placeholder="Example: FY-1001"/><button class="primary" onclick="trackSpecificOrder()">Track</button></div></div><div id="trackingResult" style="margin-top:16px">${order?trackingHtml(order):'<p>No order selected yet.</p>'}</div>`}function trackSpecificOrder(){state.lastOrderId=byId('trackId').value.trim().toUpperCase();saveState();renderTrack()}function trackingHtml(order){const isCancelled=order.status==='Cancelled'||order.status==='Rejected';return `<div class="card"><div class="order-head"><div><h3>Order ${order.id}</h3><p>${order.customer.name} - ${money(order.total)}</p></div><span class="tag ${isCancelled?'red':'green'}">${order.status}</span></div><div class="status-steps">${statusOrder.map(s=>`<div class="step ${isCancelled?'cancelled':(statusOrder.indexOf(s)<=statusOrder.indexOf(order.status)?'done':'')}">${s}</div>`).join('')}</div><div class="mini-line"><strong>Payment</strong><span>${order.payment}</span></div><div class="mini-line"><strong>Delivery person</strong><span>${order.deliveryId?getDeliveryName(order.deliveryId):'Not assigned yet'}</span></div><div class="mini-line"><strong>Items</strong><span>${order.items.map(i=>`${i.qty}x ${i.name}`).join(', ')}</span></div><p>Estimated preparation time is shown as a range because kitchen timing can vary.</p></div>`}
function renderAssistant(){byId('assistant').innerHTML=`<h2>AI Menu Assistant</h2><p>This is a free rule-based assistant for the demo. It recommends only available menu items.</p><div class="notice">No paid AI API is used here. This keeps the prototype free.</div><div class="card"><div id="chatBox" class="chat-box">${state.chat.map(m=>`<div class="msg ${m.from==='user'?'user-msg':'bot-msg'}">${m.text}</div>`).join('')}</div><div class="row" style="margin-bottom:10px">${['I want sushi','I am very hungry','I want a drink','No cheese please','I want loaded fries'].map(p=>`<button class="secondary" onclick="quickPrompt('${p}')">${p}</button>`).join('')}</div><div class="row"><input id="chatInput" class="input" placeholder="Type your request..." onkeydown="if(event.key==='Enter')sendChat()"/><button class="primary" onclick="sendChat()">Send</button></div></div>`;setTimeout(()=>{const box=byId('chatBox');if(box)box.scrollTop=box.scrollHeight},10)}function quickPrompt(text){byId('chatInput').value=text;sendChat()}function sendChat(){const input=byId('chatInput'),text=input.value.trim();if(!text)return;state.chat.push({from:'user',text});state.chat.push({from:'bot',text:assistantReply(text)});input.value='';saveState();renderAssistant()}function assistantReply(text){const t=text.toLowerCase();let picks=[];if(t.includes('sushi')||t.includes('japanese')||t.includes('roll'))picks=state.menu.filter(x=>['For You Rolls','Boxes','Spring Rolls','Californias','Maxis','Futomakis','Sushi Burrito','Bowls'].includes(x.category));else if(t.includes('light')||t.includes('healthy'))picks=state.menu.filter(x=>['Bowls','Spring Rolls','Californias'].includes(x.category));else if(t.includes('hungry')||t.includes('big')||t.includes('full'))picks=state.menu.filter(x=>['Combos','Loaded Fries','Premium Sandwiches','Loaded Mac'].includes(x.category));else if(t.includes('drink')||t.includes('juice')||t.includes('coffee'))picks=state.menu.filter(x=>x.category==='Drinks + Coffee');else if(t.includes('dessert')||t.includes('sweet')||t.includes('sundae'))picks=state.menu.filter(x=>['Desserts','Sundae'].includes(x.category));else if(t.includes('cheese'))picks=state.menu.filter(x=>!x.ingredients.some(i=>i.toLowerCase().includes('cheese')));else if(t.includes('spicy'))picks=state.menu.filter(x=>['Loaded Fries','Sandwiches','Premium Sandwiches'].includes(x.category));else if(t.includes('fries'))picks=state.menu.filter(x=>x.category==='Loaded Fries'||x.id==='fries');else picks=state.menu.filter(x=>x.available).slice(0,3);picks=picks.filter(x=>x.available).slice(0,3);if(!picks.length)return 'I could not find an available match. Please check the menu or ask for another type of meal.';return `I recommend: ${picks.map(x=>`${x.name} (${money(x.price)})`).join(', ')}. You can add them from the Menu page.`}
function renderManager(){if(!managerLoggedIn){byId('manager').innerHTML=loginHtml('Manager Login','Use PIN 1234 for the demo.','managerPin','loginManager()');return}byId('manager').innerHTML=`<h2>Manager Dashboard</h2><div class="tabs">${['orders','menu','analytics'].map(t=>`<button class="secondary ${managerTab===t?'active':''}" onclick="managerTab='${t}';renderManager()">${t[0].toUpperCase()+t.slice(1)}</button>`).join('')}<button class="ghost" onclick="managerLoggedIn=false;renderManager()">Logout</button><button class="danger" onclick="resetDemo()">Reset Demo Data</button></div>${managerTab==='orders'?managerOrdersHtml():managerTab==='menu'?managerMenuHtml():managerAnalyticsHtml()}`}function loginHtml(title,help,inputId,action){return `<div class="card login-box"><h2>${title}</h2><p>${help}</p><input id="${inputId}" class="input" type="password" placeholder="Enter PIN" onkeydown="if(event.key==='Enter')${action}"/><button class="primary" style="width:100%;margin-top:12px" onclick="${action}">Enter</button></div>`}function loginManager(){if(byId('managerPin').value===MANAGER_PIN){managerLoggedIn=true;renderManager()}else alert('Wrong PIN')}function managerOrdersHtml(){return `<div class="card"><h3>Order Queue</h3>${state.orders.map(orderCard).join('')||'<p>No orders.</p>'}</div>`}function orderCard(o){return `<div class="order-card"><div class="order-head"><div><strong>${o.id}</strong><br><span class="tag">${timeAgo(o.createdAt)}</span> <span class="tag green">${o.status}</span></div><strong>${money(o.total)}</strong></div><div>${o.items.map(i=>`${i.qty}x ${i.name}`).join(', ')}</div><div class="order-actions"><button class="secondary" onclick="viewOrder('${o.id}')">Details</button><button class="success" onclick="updateOrderStatus('${o.id}','Accepted')">Accept</button><button class="danger" onclick="updateOrderStatus('${o.id}','Rejected')">Reject</button><button class="secondary" onclick="updateOrderStatus('${o.id}','Preparing')">Preparing</button><button class="secondary" onclick="updateOrderStatus('${o.id}','Out for delivery')">Out for delivery</button><select onchange="assignDelivery('${o.id}',this.value)"><option value="">Assign delivery</option>${state.deliveryPeople.map(d=>`<option value="${d.id}" ${o.deliveryId===d.id?'selected':''}>${d.name} ${d.available?'(Available)':'(Unavailable)'}</option>`).join('')}</select></div></div>`}function viewOrder(id){const o=state.orders.find(x=>x.id===id);showModal(`<h2>Order ${o.id}</h2><div class="mini-line"><strong>Customer</strong><span>${o.customer.name}</span></div><div class="mini-line"><strong>Phone</strong><span>${o.customer.phone}</span></div><div class="mini-line"><strong>Address</strong><span>${o.customer.address}</span></div><div class="mini-line"><strong>Payment</strong><span>${o.payment}</span></div><div class="mini-line"><strong>Delivery</strong><span>${o.deliveryId?getDeliveryName(o.deliveryId):'Not assigned'}</span></div><div class="mini-line"><strong>Items</strong><span>${o.items.map(i=>`${i.qty}x ${i.name}`).join(', ')}</span></div><button class="secondary" onclick="closeModal()">Close</button>`)}function updateOrderStatus(id,status){const o=state.orders.find(x=>x.id===id);o.status=status;saveState();renderAll()}function assignDelivery(id,deliveryId){const o=state.orders.find(x=>x.id===id);o.deliveryId=deliveryId;if(deliveryId&&statusOrder.indexOf(o.status)<statusOrder.indexOf('Out for delivery'))o.status='Out for delivery';saveState();renderAll()}
function managerMenuHtml(){return `<div class="card"><h3>Menu Availability</h3><p>Manager can temporarily disable any item. Disabled items cannot be ordered.</p>${state.menu.map(item=>`<div class="staff-line"><div><strong>${item.name}</strong><br><span class="tag">${item.category}</span></div><span class="price">${money(item.price)}</span><button class="${item.available?'success':'danger'}" onclick="toggleItem('${item.id}')">${item.available?'Available':'Unavailable'}</button></div>`).join('')}</div>`}function toggleItem(id){const item=getMenuItem(id);item.available=!item.available;saveState();renderAll()}function managerAnalyticsHtml(){const totalRevenue=state.orders.filter(o=>!['Rejected','Cancelled'].includes(o.status)).reduce((s,o)=>s+o.total,0);const delivered=state.orders.filter(o=>o.status==='Delivered').length;const counts={};state.orders.forEach(o=>o.items.forEach(i=>counts[i.name]=(counts[i.name]||0)+i.qty));const top=Object.entries(counts).sort((a,b)=>b[1]-a[1]).slice(0,6);return `<div class="grid-2"><div class="card"><h3>Total Revenue</h3><div class="stat-value">${money(totalRevenue)}</div></div><div class="card"><h3>Total Orders</h3><div class="stat-value">${state.orders.length}</div></div><div class="card"><h3>Delivered Orders</h3><div class="stat-value">${delivered}</div></div><div class="card"><h3>Available Items</h3><div class="stat-value">${state.menu.filter(x=>x.available).length}</div></div></div><div class="card" style="margin-top:16px"><h3>Most Ordered Items</h3>${top.map(([name,qty])=>`<div class="mini-line"><span>${name}</span><strong>${qty}</strong></div>`).join('')||'<p>No orders yet.</p>'}</div>`}
function renderDelivery(){if(!deliveryLoggedIn){byId('delivery').innerHTML=loginHtml('Delivery Login','Use PIN 2222 for the demo.','deliveryPin','loginDelivery()');return}const orders=state.orders.filter(o=>o.deliveryId===deliveryPersonId&&!['Delivered','Rejected','Cancelled'].includes(o.status));byId('delivery').innerHTML=`<h2>Delivery Dashboard</h2><div class="row" style="margin-bottom:12px"><select class="input" style="max-width:250px" onchange="deliveryPersonId=this.value;renderDelivery()">${state.deliveryPeople.map(d=>`<option value="${d.id}" ${deliveryPersonId===d.id?'selected':''}>${d.name}</option>`).join('')}</select><button class="secondary" onclick="toggleDeliveryAvailability('${deliveryPersonId}')">Toggle Availability</button><button class="ghost" onclick="deliveryLoggedIn=false;renderDelivery()">Logout</button></div><div class="card"><h3>Assigned Orders</h3>${orders.map(deliveryOrderCard).join('')||'<p>No assigned active orders.</p>'}</div>`}function loginDelivery(){if(byId('deliveryPin').value===DELIVERY_PIN){deliveryLoggedIn=true;renderDelivery()}else alert('Wrong PIN')}function deliveryOrderCard(o){return `<div class="order-card"><div class="order-head"><div><strong>${o.id}</strong><br><span class="tag green">${o.status}</span></div><strong>${money(o.total)}</strong></div><div class="mini-line"><strong>Customer</strong><span>${o.customer.name}</span></div><div class="mini-line"><strong>Phone</strong><span>${o.customer.phone}</span></div><div class="mini-line"><strong>Address</strong><span>${o.customer.address}</span></div><div class="mini-line"><strong>Payment</strong><span>${o.payment}</span></div><div class="mini-line"><strong>Items</strong><span>${o.items.map(i=>`${i.qty}x ${i.name}`).join(', ')}</span></div><button class="success" onclick="updateOrderStatus('${o.id}','Delivered')">Mark as Delivered</button></div>`}function toggleDeliveryAvailability(id){const d=state.deliveryPeople.find(x=>x.id===id);d.available=!d.available;saveState();renderAll()}
function timeAgo(dateString){const mins=Math.max(0,Math.round((Date.now()-new Date(dateString).getTime())/60000));if(mins<1)return'just now';if(mins<60)return`${mins} min ago`;return`${Math.round(mins/60)} h ago`}function showModal(html){byId('modal').innerHTML=html;byId('modalBackdrop').classList.add('show')}function closeModal(){byId('modalBackdrop').classList.remove('show')}byId('modalBackdrop').addEventListener('click',e=>{if(e.target.id==='modalBackdrop')closeModal()});function resetDemo(){if(!confirm('Reset all demo orders, menu availability, cart, and chat?'))return;localStorage.removeItem(STORE_KEY);state=loadState();renderAll()}function escapeHtml(str){return String(str).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#039;','"':'&quot;'}[c]))}function escapeJs(str){return String(str).replace(/\\/g,'\\\\').replace(/'/g,"\\'")}
renderAll();
</script>
